aid: flyzipline
name: Flyzipline
description: Flyzipline (Zipline International Inc., flyzipline.com / zipline.com) designs, manufactures,
  and operates autonomous delivery drones for food, groceries, and medicine. Its instant logistics
  platform flies vital shipments — blood products, vaccines, pharmaceuticals, prepared meals, and
  retail goods — on direct aerial routes at up to 70 mph, with temperature-controlled pods and
  real-time tracking. Zipline operates distribution centers across the United States, Rwanda, Ghana,
  Nigeria, Kenya, Côte d'Ivoire, and Japan, partnering with health systems, retailers (Walmart,
  Chipotle), and restaurant technology providers (Olo) that submit delivery requests through
  Zipline's ordering system or software integrations. As of early 2026 the fleet has completed more
  than two million commercial deliveries across 120+ million autonomous miles. This profile was
  surfaced as a Techstars-adjacent portfolio lead and enriched by the API Evangelist pipeline; Zipline
  publishes no public developer API, SDK, or OpenAPI at this time — partner integrations are bespoke.
